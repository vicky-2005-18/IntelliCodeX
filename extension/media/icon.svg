<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="icxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" fill="url(#icxGrad)" stroke="#A78BFA" stroke-width="3" filter="url(#glow)" opacity="0.95"/>
  <polygon points="64,16 108,40 108,88 64,112 20,88 20,40" fill="#0F172A" opacity="0.92"/>

  <!-- Code / AST Nodes Graph -->
  <circle cx="64" cy="38" r="8" fill="#38BDF8"/>
  <circle cx="42" cy="74" r="7" fill="#818CF8"/>
  <circle cx="86" cy="74" r="7" fill="#C084FC"/>
  <circle cx="64" cy="94" r="6" fill="#34D399"/>

  <!-- Edges -->
  <line x1="64" y1="38" x2="42" y2="74" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="2,2"/>
  <line x1="64" y1="38" x2="86" y2="74" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="2,2"/>
  <line x1="42" y1="74" x2="64" y2="94" stroke="#818CF8" stroke-width="2"/>
  <line x1="86" y1="74" x2="64" y2="94" stroke="#34D399" stroke-width="2"/>

  <!-- Robot Mascot Eyes / Visor -->
  <rect x="52" y="56" width="24" height="8" rx="4" fill="#38BDF8"/>
</svg>
