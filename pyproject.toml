[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intellicodex"
version = "1.0.0"
description = "AI-Powered Repository Search, Dependency Analysis & Code Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IntelliCodeX Team"}
]
keywords = ["code-search", "rag", "ast", "dependency-graph", "call-graph", "llm", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "networkx>=3.0",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "requests>=2.31",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "psutil>=5.9.0",
    "watchdog>=4.0.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
intellicodex = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "rag*", "backend*", "server*"]
