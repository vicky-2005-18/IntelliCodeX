name: IntelliCodeX Pull Request Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    name: IntelliCodeX Code Review & Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov bandit

      - name: Run IntelliCodeX PR Review Bot
        id: review_bot
        run: |
          python scripts/pr_review_bot.py \
            --repo . \
            --base-ref "${{ github.base_ref }}" \
            --output-md pr_review_comment.md \
            --output-json pr_review.json \
            --strict
        continue-on-error: true

      - name: Post or Update PR Review Comment
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const commentPath = 'pr_review_comment.md';
            if (!fs.existsSync(commentPath)) {
              console.log('No PR review comment found.');
              return;
            }

            const commentBody = '<!-- intellicodex-pr-review-bot -->\n' + fs.readFileSync(commentPath, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Search for existing IntelliCodeX PR bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.find(comment => 
              comment.body.includes('<!-- intellicodex-pr-review-bot -->')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR review comment ID: ${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
              console.log('Created new PR review comment.');
            }

      - name: Enforce Verification Gate
        if: steps.review_bot.outcome == 'failure'
        run: |
          echo "::error::IntelliCodeX PR Review Bot rejected this pull request due to security or architectural gate failures."
          exit 1
